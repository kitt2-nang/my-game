<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3ec">
<title>커피 내기 사다리 타기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
:root{--ink:#352c27;--muted:#897d73;--cream:#fbf8f1;--line:#c9bdb0;--orange:#e77b43;--green:#547b59;--gold:#f4c96b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#fffefa,#f2eadf 72%);color:var(--ink);font-family:'Gowun Dodum',sans-serif;padding:28px 16px 40px}.wrap{width:min(100%,760px);margin:auto}.head{text-align:center;margin:6px auto 23px}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #e8d7c4;background:#fff9ef;border-radius:99px;padding:6px 12px;color:#a66b42;font-size:12px;font-weight:bold}.head h1{font:clamp(31px,7vw,45px)/1.2 'Jua',sans-serif;margin:13px 0 7px;letter-spacing:.01em}.head p{margin:0;color:var(--muted);font-size:14px}
.panel{background:#fffdf9;border:1px solid #eadfd2;border-radius:23px;padding:22px;box-shadow:0 16px 44px #76553912}.setup-title{font:21px 'Jua',sans-serif;margin:0 0 13px}.entry-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.entry{height:45px;min-width:0;border:1.5px solid #e6ddd3;background:#fff;border-radius:12px;padding:0 12px;font:15px 'Gowun Dodum',sans-serif;color:var(--ink);outline:none;transition:.16s}.entry:focus{border-color:var(--orange);box-shadow:0 0 0 3px #e77b431c}.entry::placeholder{color:#b4aaa0}.setup-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:13px 0 20px;color:var(--muted);font-size:12px}.count{font-weight:bold;color:#927c68}.buttons{display:flex;gap:8px}.small-btn{border:1px solid #e9dfd5;background:#fffaf3;color:#77685c;border-radius:10px;padding:8px 12px;font:13px 'Gowun Dodum',sans-serif;cursor:pointer}.small-btn:hover{background:#f8efe4}.primary{width:100%;border:0;border-radius:13px;background:var(--orange);color:white;padding:13px 18px;font:20px 'Jua',sans-serif;cursor:pointer;box-shadow:0 4px 0 #c56232;transition:transform .12s,filter .12s}.primary:hover{filter:brightness(1.04)}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #c56232}
.board-wrap{margin-top:21px;display:none}.board-wrap.show{display:block}.board-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 9px}.board-head h2{font:20px 'Jua',sans-serif;margin:0}.board-head span{font-size:12px;color:var(--muted)}.board{overflow-x:auto;background:#fffdf9;border:1px solid #eadfd2;border-radius:18px;padding:16px 11px 13px;scrollbar-color:#ddcbbb transparent}.ladder{width:100%;min-width:330px;display:block}.labels{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;margin:0 0 2px}.name-button{border:0;background:transparent;color:var(--ink);font:15px 'Jua',sans-serif;padding:4px 1px 8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name-button:after{content:' ↓';color:#c5a184;font:12px sans-serif}.name-button:hover,.name-button.selected{color:var(--orange)}.name-button:disabled{cursor:default}.results{display:grid;grid-template-columns:repeat(var(--n),1fr);margin-top:1px}.result{justify-self:stretch;text-align:center;margin:0 3px;padding:10px 2px;border-radius:10px;background:#f4efe8;color:#796e63;font-size:clamp(10px,2.6vw,13px);font-weight:bold;white-space:nowrap}.result.win{background:#fff0df;color:#b6522a;border:1px solid #f0c390}.result.active{box-shadow:0 0 0 2px var(--orange);transform:translateY(1px)}.canvas-area{position:relative}.canvas-area canvas{display:block;width:100%;height:auto}.winner-card{display:none;margin-top:14px;border-radius:15px;padding:13px 16px;text-align:center;background:#fff4e4;border:1px solid #f0d6b0;color:#715233}.winner-card.show{display:block;animation:pop .35s ease-out}.winner-card small{display:block;color:#9e7c56;font-size:11px;letter-spacing:.08em}.winner-card strong{font:25px 'Jua',sans-serif;color:#bd5932}.winner-card em{font-style:normal;color:#6c7950;font-weight:bold}.notice{text-align:center;min-height:19px;margin:12px 0 0;color:#a65b40;font-size:13px}.reset-line{text-align:center;margin-top:13px}.reset-line button{display:none}.reset-line button.show{display:inline-block}.foot{text-align:center;color:#aa9b8a;font-size:11px;margin:18px auto 0}.shake{animation:shake .25s linear 2}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:620px){body{padding:20px 11px 28px}.panel{padding:17px 14px}.entry-list{grid-template-columns:repeat(2,minmax(0,1fr))}.setup-row{align-items:flex-start;flex-direction:column;margin:12px 0 17px}.buttons{width:100%}.small-btn{flex:1}.board{padding:12px 7px 10px}.name-button{font-size:13px}.board-head{align-items:flex-end}.board-head span{text-align:right}}
</style>
</head>
<body>
<main class="wrap">
  <header class="head"><div class="badge">☕ 오늘의 커피 당번 뽑기</div><h1>커피 내기 사다리 타기</h1><p>이름을 적고 사다리를 타면, 커피 쏠 사람이 정해져요!</p></header>
  <section class="panel" aria-label="참가자 설정"><h2 class="setup-title">누가 함께하나요?</h2><div class="entry-list" id="entries"></div><div class="setup-row"><span class="count" id="count"></span><div class="buttons"><button class="small-btn" id="add">＋ 참가자 추가</button><button class="small-btn" id="remove">－ 마지막 참가자 삭제</button></div></div><button class="primary" id="start">사다리 시작하기</button></section>
  <section class="board-wrap" id="boardWrap" aria-label="사다리 결과"><div class="board-head"><h2>한 명씩 이름을 눌러 보세요</h2><span>선을 따라가면 결과가 나와요</span></div><div class="board"><div class="labels" id="labels"></div><div class="canvas-area"><canvas id="canvas"></canvas></div><div class="results" id="results"></div></div><div class="winner-card" id="winnerCard"></div><div class="notice" id="notice" aria-live="polite"></div><div class="reset-line"><button class="small-btn" id="again">새 사다리 만들기</button></div></section>
  <footer class="foot">당첨 한 명은 커피 쏘기! 모두의 운을 빌어요 ☘</footer>
</main>
<script>
(()=>{
 const entriesEl=document.querySelector('#entries'),countEl=document.querySelector('#count'),addBtn=document.querySelector('#add'),removeBtn=document.querySelector('#remove'),startBtn=document.querySelector('#start'),wrap=document.querySelector('#boardWrap'),labelsEl=document.querySelector('#labels'),resultsEl=document.querySelector('#results'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),notice=document.querySelector('#notice'),winnerCard=document.querySelector('#winnerCard'),again=document.querySelector('#again');
 const starter=['지민','서준','하늘','민지'];let names=[],rungs=[],paths=[],revealed=new Set(),busy=false,anim=null,completed=false;
 function inputNames(){return [...entriesEl.querySelectorAll('input')].map(x=>x.value.trim())}
 function renderInputs(values){names=values;entriesEl.innerHTML='';values.forEach((v,i)=>{const input=document.createElement('input');input.className='entry';input.maxLength=10;input.value=v;input.placeholder=`참가자 ${i+1}`;input.setAttribute('aria-label',`참가자 ${i+1} 이름`);input.addEventListener('input',()=>updateCount());entriesEl.append(input)});updateCount()}
 function updateCount(){const n=entriesEl.children.length;countEl.textContent=`${n}명 참가`;addBtn.disabled=n>=8;removeBtn.disabled=n<=2;addBtn.style.opacity=n>=8?'.45':'1';removeBtn.style.opacity=n<=2?'.45':'1'}
 addBtn.onclick=()=>{const v=inputNames();if(v.length<8){v.push('');renderInputs(v);entriesEl.lastElementChild.focus()}};removeBtn.onclick=()=>{const v=inputNames();if(v.length>2){v.pop();renderInputs(v)}};
 function makeRungs(n){const rows=Math.max(8,Math.min(13,n*2+2));const list=[];for(let r=0;r<rows;r++){const row=[];for(let c=0;c<n-1;c++){if(Math.random()<.39&&(c===0||!row.includes(c-1)))row.push(c)}list.push(row)}return list}
 function travel(start){let col=start;const route=[{col,row:-1}];for(let r=0;r<rungs.length;r++){if(rungs[r].includes(col))col++;else if(col>0&&rungs[r].includes(col-1))col--;route.push({col,row:r})}return {route,end:col}}
 function setupBoard(){const n=names.length;labelsEl.style.setProperty('--n',n);resultsEl.style.setProperty('--n',n);labelsEl.innerHTML='';resultsEl.innerHTML='';names.forEach((name,i)=>{const b=document.createElement('button');b.className='name-button';b.textContent=name;b.title=`${name}의 사다리 결과 보기`;b.onclick=()=>reveal(i);labelsEl.append(b);const d=document.createElement('div');d.className='result'+(i===0?' win':'');d.textContent=i===0?'당첨! 커피 쏘기':'통과';resultsEl.append(d)});rungs=makeRungs(n);paths=names.map((_,i)=>travel(i));revealed=new Set();completed=false;busy=false;notice.textContent='이름을 눌러 사다리를 따라가 보세요.';winnerCard.className='winner-card';winnerCard.innerHTML='';again.classList.remove('show');wrap.classList.add('show');draw();wrap.scrollIntoView({behavior:'smooth',block:'nearest'})}
 function draw(){const n=names.length;const width=Math.max(330,canvas.parentElement.clientWidth-14);const height=Math.max(245,Math.min(360,rungs.length*25+20));const dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const pad=width<400?18:28;const xs=Array.from({length:n},(_,i)=>pad+(width-2*pad)*i/(n-1));const top=10,bottom=height-10,step=(bottom-top)/(rungs.length+1);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#c9bdb0';ctx.lineWidth=3;for(let c=0;c<n;c++){ctx.beginPath();ctx.moveTo(xs[c],top);ctx.lineTo(xs[c],bottom);ctx.stroke()}for(let r=0;r<rungs.length;r++)for(const c of rungs[r]){const y=top+step*(r+1);ctx.beginPath();ctx.moveTo(xs[c],y);ctx.lineTo(xs[c+1],y);ctx.stroke()}for(let c=0;c<n;c++){ctx.beginPath();ctx.fillStyle='#e77b43';ctx.arc(xs[c],top,4.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle='#879579';ctx.arc(xs[c],bottom,4.5,0,Math.PI*2);ctx.fill()}
   for(const idx of revealed){const p=paths[idx],pts=routePoints(p.route,xs,top,step);ctx.beginPath();ctx.strokeStyle=idx===0?'#d84d20':'#18804a';ctx.lineWidth=7;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=7;pts.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.stroke();ctx.shadowBlur=0}
   if(anim){const pts=routePoints(anim.route,xs,top,step);const progress=Math.min(pts.length-1,anim.progress);ctx.beginPath();ctx.strokeStyle='#e85822';ctx.lineWidth=7;ctx.shadowColor='#e8582288';ctx.shadowBlur=7;ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(progress>=i)ctx.lineTo(b.x,b.y);else if(progress>i-1){const f=progress-(i-1);ctx.lineTo(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f);break}else break}ctx.stroke();ctx.shadowBlur=0;const seg=Math.min(Math.floor(progress),pts.length-2),f=Math.min(1,progress-seg),a=pts[seg],b=pts[seg+1];ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e85822';ctx.lineWidth=3;ctx.stroke()}}
 function routePoints(route,xs,top,step){const bottom=top+step*(rungs.length+1);const pts=[{x:xs[route[0].col],y:top}];for(let k=1;k<route.length;k++){const y=top+step*k;pts.push({x:xs[route[k-1].col],y});if(route[k].col!==route[k-1].col)pts.push({x:xs[route[k].col],y})}pts.push({x:xs[route[route.length-1].col],y:bottom});return pts}
 function reveal(i){if(busy||revealed.has(i))return;busy=true;const route=paths[i].route;const pointCount=routePoints(route,Array.from({length:names.length},(_,c)=>c),0,1).length;const started=performance.now(),duration=1400;notice.textContent=`${names[i]} 님의 결과를 확인하는 중…`;anim={route,progress:0,index:i};function tick(now){if(!anim||anim.index!==i)return;const progress=Math.min(1,(now-started)/duration);anim.progress=progress*(pointCount-1);draw();if(progress<1){requestAnimationFrame(tick);return}revealed.add(i);const end=paths[i].end;anim=null;busy=false;draw();labelsEl.children[i].classList.add('selected');labelsEl.children[i].disabled=true;resultsEl.children[end].classList.add('active');if(end===0){winnerCard.innerHTML=`<small>☕ 오늘의 커피 당번</small><strong>${escapeHtml(names[i])}</strong><em> 님, 커피 쏘기!</em>`;winnerCard.classList.add('show');notice.textContent='당첨자가 나왔어요! 나머지도 확인해 보세요.'}else notice.textContent=`${names[i]} 님은 통과!`;if(revealed.size===names.length){completed=true;again.classList.add('show');notice.textContent='모두 확인했어요. 새 사다리로 한 판 더?'}}requestAnimationFrame(tick)}
 function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 startBtn.onclick=()=>{const raw=inputNames();if(raw.length<2||raw.length>8){notice.textContent='참가자는 2명부터 8명까지 설정해 주세요.';return}if(raw.some(x=>!x)){entriesEl.classList.remove('shake');void entriesEl.offsetWidth;entriesEl.classList.add('shake');notice.textContent='빈 이름 칸을 채워 주세요.';entriesEl.querySelector('input:not([value])')?.focus();return}if(new Set(raw.map(x=>x.toLocaleLowerCase())).size!==raw.length){notice.textContent='이름이 겹쳐요. 구분할 수 있게 바꿔 주세요.';return}names=raw;setupBoard()};again.onclick=()=>setupBoard();window.addEventListener('resize',()=>{if(wrap.classList.contains('show'))draw()});renderInputs(starter)
})();
</script>
</body>
</html>
